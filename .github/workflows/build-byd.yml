name: Build BYD APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Fix gradlew
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x ./gradlew

      - name: Build BYD APK
        run: ./gradlew :app:assembleBydRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AuroraStore-BYD
          path: app/build/outputs/apk/byd/release/*.apk
